<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    (function() {
      var lang = navigator.language || navigator.userLanguage || 'en';
      var shortLang = lang.split('-')[0].toLowerCase();
      var supported = ['ko', 'en', 'ja', 'de'];
      var target = supported.includes(shortLang) ? shortLang : 'en';
      window.location.replace('/' + target + '/datrans');
    })();
  </script>
</head>
<body>
  <p>Redirecting to your language...</p>
</body>
</html>
